name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04  # ubuntu-latest (26.04) has no CPython 3.9 in setup-python's manifest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
